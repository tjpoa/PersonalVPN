name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/api
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/reconciler
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/gateway-agent

  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static repository checks
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Diff check
        shell: pwsh
        run: git diff --check

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging compose
        run: docker compose -f deploy/docker-compose.staging.yml config --no-interpolate
      - name: Build reconciler image target
        run: docker build --target reconciler --tag personalvpn-reconciler:ci services/api
      - name: Build gateway-agent image target
        run: docker build --target gateway-agent --tag personalvpn-gateway-agent:ci services/api

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android and TV APK
        run: gradle lint test assembleDebug --no-daemon

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows client
        run: dotnet build clients/windows/PersonalVpn.Client.csproj --configuration Release

  ios-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package
        run: swift test --package-path clients/ios
